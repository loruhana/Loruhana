<text x="375" y="154" text-anchor="middle" class="s" font-size="13" fill="#8B949E">C6 Bank</text>
</g>
<g class="n" style="animation-delay:1.34s">
<text x="525" y="60" text-anchor="middle" class="s" font-size="15" font-weight="700" fill="#8B949E">2024</text>
<circle cx="525" cy="92" r="7" fill="#0D1117" stroke="#B26BFF" stroke-width="3"/>
<text x="525" y="132" text-anchor="middle" class="s" font-size="14" font-weight="700" fill="#E6EDF3">QA Manager</text>
<text x="525" y="154" text-anchor="middle" class="s" font-size="13" fill="#8B949E">CSP Tech</text>
</g>
<g class="n" style="animation-delay:1.72s">
<text x="675" y="60" text-anchor="middle" class="s" font-size="15" font-weight="700" fill="#8B949E">2025</text>
