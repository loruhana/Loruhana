<text x="825" y="60" text-anchor="middle" class="s" font-size="15" font-weight="700" fill="#F15BFF">2026 → hoje</text>
<circle class="now" cx="825" cy="92" r="14" fill="#F15BFF"/>
<circle cx="825" cy="92" r="9" fill="#F15BFF" stroke="#FFFFFF" stroke-width="3"/>
<text x="825" y="132" text-anchor="middle" class="s" font-size="14" font-weight="700" fill="#E6EDF3">Lead QA Engineer</text>
<text x="825" y="154" text-anchor="middle" class="s" font-size="13" fill="#3DDCFF">SPDATA</text>
