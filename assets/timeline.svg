<text x="225" y="132" text-anchor="middle" class="s" font-size="14" font-weight="700" fill="#E6EDF3">Quality Engineer</text>
<text x="225" y="154" text-anchor="middle" class="s" font-size="13" fill="#8B949E">Atlas</text>
</g>
<g class="n" style="animation-delay:0.96s">
<text x="375" y="60" text-anchor="middle" class="s" font-size="15" font-weight="700" fill="#8B949E">2021</text>
<circle cx="375" cy="92" r="7" fill="#0D1117" stroke="#B26BFF" stroke-width="3"/>
